name: Development CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      # Torch 2.4's compiler enables an internal decomposition assertion whenever
      # CI is nonempty. It fails on valid NLL operations; fullgraph tests stay on.
      CI: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Build and test an installed sdist with minimum dependencies
        run: |
          exec > >(tee source-test.log) 2>&1
          python -m pip install build==1.6.1 twine==7.0.0 mypy
          python -m build --sdist
          python -m twine check --strict dist/*
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          python -m pip install 'numpy<2' dist/*.tar.gz pytest hypothesis scipy
          python -c 'import exacta, exacta._C; print(exacta.__file__, exacta._C.__file__)'
          python -m pytest -q
          python -m mypy src/exacta
      - name: Expose failure details in the check annotations
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          log = Path("source-test.log")
          if log.exists():
              message = "\n".join(log.read_text()[-12000:].splitlines()[-80:])
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Source build or test failure::{message}")
          PY

  wheels:
    uses: ./.github/workflows/wheels.yml
