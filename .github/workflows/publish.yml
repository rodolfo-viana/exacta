name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'rodolfo-viana/exacta'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install release validation dependency
        run: python -m pip install build==1.6.1
      - name: Verify the release tag, version and main history
        id: check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release.py --ref "$GITHUB_REF" --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_VERSION: ${{ needs.release.outputs.version }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      TORCHINDUCTOR_COMPILE_THREADS: "1"
      # Match development CI's minimum-Torch compiler environment.
      CI: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build and validate the source distribution
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --sdist
          python -m twine check --strict dist/*
          python - <<'PY'
          import email
          import os
          import tarfile
          from pathlib import Path
          from packaging.version import Version

          archives = list(Path("dist").glob("*.tar.gz"))
          assert len(archives) == 1, "Expected exactly one source distribution"
          archive = archives[0]
          with tarfile.open(archive) as source:
              metadata = source.extractfile(f"{archive.name.removesuffix('.tar.gz')}/PKG-INFO")
              assert metadata is not None
              message = email.message_from_bytes(metadata.read())
          expected = os.environ["EXPECTED_VERSION"]
          version = Version(expected)
          assert str(version) == expected, "Use a canonical package version"
          assert not version.is_devrelease and version.local is None, "Development versions cannot be published"
          assert archive.name == f"exacta-{expected}.tar.gz", "Source version does not match requested release"
          assert message["Name"] == "exacta" and message["Version"] == expected
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"EXPECTED_VERSION={expected}\n")
          PY
      - name: Install the artifact with the minimum supported PyTorch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          python -m pip install "numpy<2" "dist/exacta-${EXPECTED_VERSION}.tar.gz[test]"
      - name: Test the installed distribution
        run: |
          python - <<'PY'
          import os
          import exacta
          assert exacta.__version__ == os.environ["EXPECTED_VERSION"]
          print("Testing installed package:", exacta.__file__)
          PY
          python -m pytest -q
      - name: Store the tested distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-distributions
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/exacta/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pypi-*
          merge-multiple: true
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  wheels:
    needs: release
    uses: ./.github/workflows/wheels.yml
