name: Linux wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build, repair and test portable wheels
        run: |
          exec > >(tee "$RUNNER_TEMP/wheel-build.log") 2>&1
          python -m pip install cibuildwheel==4.3.4
          python -m cibuildwheel --output-dir wheelhouse
      - name: Expose failure details in the check annotations
        if: failure()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "wheel-build.log"
          if log.exists():
              message = "\n".join(log.read_text()[-3000:].splitlines()[-35:])
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Wheel build or test failure::{message}")
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pypi-wheels-linux
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  stable-abi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pypi-wheels-linux
          path: wheelhouse
      - name: Test the Python 3.12 stable-ABI wheel on a newer interpreter
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install wheelhouse/*cp312-abi3*.whl pytest hypothesis scipy
          python -c 'import exacta, exacta._C; print(exacta.__file__, exacta._C.__file__)'
          python -m pytest -q
