[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "exacta"
dynamic = ["version"]
description = "Fast, reference-validated losses and metrics for deep learning on CPU and GPU."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.22"]
authors = [{name = "Rodolfo Viana"}]

[project.urls]
Documentation = "https://github.com/rodolfo-viana/exacta/wiki"
Source = "https://github.com/rodolfo-viana/exacta"
Issues = "https://github.com/rodolfo-viana/exacta/issues"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "numpy>=1.22", "scipy>=1.10"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# The extension uses the stable ABI, so one wheel per platform serves every Python >= 3.12.
wheel.py-api = "cp312"
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "src/exacta/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # raised inside Triton's code generator on Python 3.14, not by exacta
    "ignore:AnnAssign.__init__ missing:DeprecationWarning",
]

[tool.mypy]
ignore_missing_imports = true

[tool.cibuildwheel]
build = ["cp310-manylinux_x86_64", "cp311-manylinux_x86_64", "cp312-manylinux_x86_64"]
archs = ["x86_64"]
test-requires = ["pytest>=8", "hypothesis>=6", "numpy<2", "scipy>=1.10"]
before-test = "python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1"
test-command = "python -m pytest -q {project}/tests"
# Empty CI disables Torch 2.4's internal-only decomposition assertion, not tests.
environment = { OMP_NUM_THREADS = "2", MKL_NUM_THREADS = "2", CMAKE_BUILD_PARALLEL_LEVEL = "2", CI = "" }

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"

[[tool.mypy.overrides]]
# Triton kernels are a DSL: loop variables and arguments are tensors, not the Python ints mypy sees.
module = ["exacta._triton_edt", "exacta._triton_losses"]
ignore_errors = true
